<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>BIOHAZARD · 生化危机 · 横版枪战</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* game-root: 必须 position: relative 让 canvas absolute 填满 */
      #game-root {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        /* iOS Safari 地址栏伸缩适配 */
        height: 100dvh;
        background: #000;
        z-index: 1;
        overflow: hidden;
      }

      /* Phaser canvas —— 关键: 绝对定位填满容器, 不能让 Phaser 用 transform 居中 */
      canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        image-rendering: pixelated;
      }

      /* 竖屏旋转提示遮罩 —— 覆盖在 canvas 上 */
      #rotate-hint {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        color: #fff;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 28px;
        padding: 24px;
        /* 默认隐藏 —— 横屏时也隐藏, 只在 JS 判定为竖屏时 .show */
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #rotate-hint.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      #rotate-hint .icon { font-size: 80px; animation: rotateHint 2s ease-in-out infinite; }
      #rotate-hint .title { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #ff1744; }
      #rotate-hint .sub   { font-size: 14px; opacity: 0.7; }
      #rotate-hint .confirm-btn {
        margin-top: 20px;
        padding: 14px 40px;
        background: #ff1744;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 2px;
      }
      @keyframes rotateHint { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }

      /* 兜底: 竖屏强制显示提示, 横屏强制隐藏 */
      @media (orientation: portrait) { #rotate-hint { opacity: 1; visibility: visible; pointer-events: auto; } }
      @media (orientation: landscape) { #rotate-hint { opacity: 0; visibility: hidden; pointer-events: none; } }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="rotate-hint">
      <div class="icon">📱</div>
      <div class="title">请旋转设备至横屏</div>
      <div class="sub">本游戏必须在横屏模式下游玩</div>
      <button class="confirm-btn" id="rotate-confirm">已转为横屏 · 继续</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 按钮点击兜底
      document.getElementById('rotate-confirm').addEventListener('click', () => {
        // 如果真的横屏了, JS syncHint 已经隐藏, 这里只是双重保险
        const hint = document.getElementById('rotate-hint');
        if (window.innerWidth > window.innerHeight) hint.classList.remove('show');
      });
    </script>
  </body>
</html>
