<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000" />
<title>OUTRUN · 户外大飙车 (Phaser)</title>
<style>
  /* ===== 全局重置 ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none; touch-action: none; }
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000;
    overflow:hidden; font-family: 'Courier New', monospace; color:#fff; }
  #game-wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; image-rendering: pixelated; }

  /* ===== 扫描线滤镜 (MD 复古效果) ===== */
  #scan { position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px,
              transparent 1px, transparent 3px); mix-blend-mode: multiply; }

  /* ===== HUD (复古仪表盘) — DOM 覆盖层, 不放进 Phaser ===== */
  #hud { position:fixed; top:0; left:0; right:0; z-index:20; padding: 8px 12px;
    display:flex; justify-content:space-between; align-items:center; pointer-events:none;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; }
  .hud-box { background:rgba(0,0,0,0.5); border:2px solid #fff; padding:5px 10px;
    font-weight:bold; font-size: clamp(12px, 3.2vw, 16px); border-radius:2px; letter-spacing:1px; }
  .hud-box.warn { color:#ff4040; border-color:#ff4040; animation: blink .5s infinite; }
  @keyframes blink { 50% { opacity:.35; } }

  /* ===== 触控按键 (DOM 覆盖层) ===== */
  #controls { position:fixed; bottom:0; left:0; right:0; z-index:30;
    height: 34vh; min-height: 150px; display:flex; justify-content:space-between;
    align-items:flex-end; padding: 12px 14px; pointer-events:none; }
  .pad-side { display:flex; gap:10px; pointer-events:auto; align-items:flex-end; }
  .btn { width: clamp(56px, 14vw, 82px); height: clamp(56px, 14vw, 82px);
    border-radius:50%; background: rgba(255,255,255,0.18);
    border: 3px solid rgba(255,255,255,0.75); color:#fff; font-size:26px; font-weight:bold;
    display:flex; align-items:center; justify-content:center; transition: background .08s, transform .08s; }
  .btn.active { transform: scale(0.92); background: rgba(255,80,80,0.55); border-color:#ff4040; }
  .btn.gas { background: rgba(40,180,40,0.45); border-color:#6f6; }
  .btn.gas.active { background: rgba(60,255,60,0.7); }
  .btn.brake { background: rgba(200,40,40,0.45); border-color:#f66; }
  .btn.brake.active { background: rgba(255,60,60,0.7); }

  /* ===== 音乐开关 ===== */
  #musicBtn { position:fixed; top:54px; right:10px; z-index:40; width:40px; height:40px;
    border-radius:50%; background: rgba(0,0,0,0.55); border:2px solid #fff; color:#fff;
    font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

  /* ===== 通用覆盖层 ===== */
  .overlay { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(20,10,40,0.93), rgba(5,0,10,0.98));
    text-align:center; padding: 24px; }
  .overlay.hidden { display:none; }
  .title-cn { font-size: clamp(34px, 10vw, 72px); font-weight:900; color:#ff3030;
    text-shadow: 3px 3px 0 #000, 6px 6px 0 #660000, 0 0 22px rgba(255,48,48,0.6);
    letter-spacing:0.05em; margin-bottom:2px; }
  .title-en { font-size: clamp(14px, 4.2vw, 28px); color:#ffcc33;
    letter-spacing:0.32em; margin-bottom: 28px; }
  .ov-btn { padding: 14px 44px; font-size: clamp(16px, 4vw, 22px); font-weight:bold; color:#fff;
    cursor:pointer; background: linear-gradient(180deg,#ff5050,#cc2020);
    border:3px solid #fff; border-radius:6px; letter-spacing:2px;
    box-shadow: 0 4px 0 #000, 0 0 18px rgba(255,48,48,0.5); }
  .ov-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
  .ov-row { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .ov-stat { font-size: clamp(14px, 3.5vw, 20px); color:#aaf; margin: 6px 0; }
  .ov-stat b { color:#ffcc33; font-size: 1.2em; }
  .ov-rank { font-size: clamp(48px, 14vw, 96px); color:#ffcc33; text-shadow:4px 4px 0 #000;
    margin: 4px 0; }
  .ov-hint { font-size: 12px; color:#888; margin-top: 18px; line-height: 1.6; }
  .branch-prompt { font-size: clamp(16px, 4vw, 24px); color:#fff; margin-bottom: 20px; }
  .branch-btn { padding:12px 28px; font-size: clamp(14px, 3.5vw, 18px); font-weight:bold;
    color:#fff; cursor:pointer; border:2px solid #fff; border-radius:6px; background:rgba(80,80,80,0.5); }
  .branch-btn:hover { background:rgba(120,120,120,0.7); }
  .branch-btn:active { transform: translateY(2px); }
</style>
</head>
<body>

<div id="game-wrap"><canvas id="game"></canvas></div>
<div id="scan"></div>

<!-- HUD (DOM 覆盖层) -->
<div id="hud">
  <div class="hud-box" id="hudTime">TIME 60.0</div>
  <div class="hud-box" id="hudStage">STAGE 1/5</div>
  <div class="hud-box" id="hudScore">SCORE 0</div>
</div>

<div id="musicBtn">♪</div>

<!-- 触控按键 (DOM) -->
<div id="controls">
  <div class="pad-side">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
  <div class="pad-side">
    <div class="btn brake" id="btnBrake">刹</div>
    <div class="btn gas" id="btnGas">油</div>
  </div>
</div>

<!-- 标题画面 -->
<div class="overlay" id="overlayTitle">
  <div class="title-cn">户外大飙车</div>
  <div class="title-en">OUT · RUN</div>
  <button class="ov-btn" id="btnStart">开始游戏</button>
  <div class="ov-hint">桌面: ←→ 转向 ↑ 油门 ↓ 刹车  空格 鸣笛<br/>手机: 底部触摸按键</div>
</div>

<!-- 分叉选择 -->
<div class="overlay hidden" id="overlayFork">
  <div class="branch-prompt">路线分叉！选择方向</div>
  <div class="ov-row">
    <button class="branch-btn" id="btnForkLeft">← 左  风景更佳</button>
    <button class="branch-btn" id="btnForkRight">右  挑战更多 →</button>
  </div>
</div>

<!-- 结算画面 -->
<div class="overlay hidden" id="overlayOver">
  <div class="title-cn" id="overTitle">游戏结束</div>
  <div class="title-en">GAME · OVER</div>
  <div class="ov-rank" id="rank">C</div>
  <div class="ov-stat">最终得分 <b id="overScore">0</b></div>
  <div class="ov-stat">行驶距离 <b id="overDist">0 m</b></div>
  <div class="ov-row" style="margin-top:20px;">
    <button class="ov-btn" id="btnRetry">重新挑战</button>
  </div>
</div>

<!-- Phaser 3 CDN -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<script>
/* ============================================================
 * OUTRUN · 户外大飙车 (Phaser 3 + Super Scaler)
 * 单 HTML 文件, CDN 引入 Phaser, 纯 Canvas 2D 手写伪3D道路
 * 关键设计: 路面主体先画完整梯形底色, 分段只画 rumble / 车道线
 *           —— 彻底消除路面横向条纹
 * ============================================================ */

// ==================== 配置 ====================
const CFG = {
  SEG_LEN: 200,        // 每段路面 z 方向长度
  ROAD_W: 2000,        // 路面半宽 (世界单位)
  LANES: 3,            // 车道数
  CAM_H: 1000,         // 相机高度
  FOV: 100,            // 视野角度 (度)
  DRAW_DIST: 220,      // 渲染的路面段数
  FOG: 5,              // 雾浓度
  CENTRIFUGAL: 0.08,   // 弯道离心力 (原0.3太强, 1秒就甩出路面)
  MAX_SPEED: 12000,    // 最大速度 (单位/秒)
  ACCEL: 3000,         // 油门加速度
  BRAKE: -8000,        // 刹车减速度
  DECEL: -1500,        // 引擎制动
  OFFROAD_DECEL: -3000,
  OFFROAD_LIMIT: 1500,
  STEER: 3.2,          // 转向速度 (提高让玩家能对抗离心力)
  START_TIME: 60,      // 初始倒计时
  CP_TIME: 18,         // 检查点加时
  STAGES: 5,           // 关卡总数
  HIT_SLOW: 0.5,
  HIT_TIME_LOSS: 1.2,
  ROAD_LIMIT: 1.4,     // 车横向移动范围 (路面±1, 允许稍微驶出)
};
const camDepth = 1 / Math.tan((CFG.FOV / 2) * Math.PI / 180);

// ==================== 主题 ====================
const THEMES = [
  { name:'beach',   sky:['#7ec8ff','#cfeaff'], grass:['#4cae4c','#48a848'], road:'#2a2a30', rumble:['#ffffff','#e02020'], sprites:'palm' },
  { name:'desert',  sky:['#ffb366','#ffe0b3'], grass:['#d6a060','#cf9a5a'], road:'#3a3a42', rumble:['#ffffff','#e02020'], sprites:'cactus' },
  { name:'mountain',sky:['#8fb8e8','#d4e8ff'], grass:['#4c7a35','#477231'], road:'#2a2a30', rumble:['#ffffff','#e02020'], sprites:'pine' },
  { name:'sunset',  sky:['#ff7043','#ffcc80'], grass:['#6c5030','#664b2d'], road:'#1a1a20', rumble:['#ffffff','#ffcc00'], sprites:'rock' },
  { name:'night',   sky:['#0a0a2a','#1a1a4a'], grass:['#162416','#142114'], road:'#18181c', rumble:['#ffffff','#ffcc00'], sprites:'pine' },
];
const CAR_COLORS = ['#2060ff','#20c020','#ffcc00','#c040ff','#ff8800','#00cccc','#ffffff','#ff3030'];

// ==================== 道路生成 ====================
let segments = [];
let trackLength = 0;

function addSegment(curve, y) {
  const i = segments.length;
  segments.push({
    index: i,
    p1: { world:{ x:0, y, z: i*CFG.SEG_LEN }, camera:{}, screen:{} },
    p2: { world:{ x:0, y, z:(i+1)*CFG.SEG_LEN }, camera:{}, screen:{} },
    curve, sprites: [], cars: [], isCheckpoint:false, isFork:false, theme: THEMES[0],
  });
}
function addRoad(enter, hold, leave, curve, y) {
  const startY = segments.length ? segments[segments.length-1].p2.world.y : 0;
  const endY = startY + y * CFG.SEG_LEN;
  const total = enter + hold + leave;
  for (let i=0;i<enter;i++) addSegment(easeIn(0, curve, i/enter), easeInOut(startY, endY, i/total));
  for (let i=0;i<hold;i++)  addSegment(curve, easeInOut(startY, endY, (enter+i)/total));
  for (let i=0;i<leave;i++) addSegment(easeInOut(curve, 0, i/leave), easeInOut(startY, endY, (enter+hold+i)/total));
}
const addStraight = (n) => addRoad(n,n,n,0,0);
const addCurve = (n,c,h=0) => addRoad(n,n,n,c,h);
const addHill = (n,h) => addRoad(n,n,n,0,h);
function easeIn(a,b,p){ return a + (b-a)*Math.pow(p,2); }
function easeInOut(a,b,p){ return a + (b-a)*((-Math.cos(p*Math.PI)/2)+0.5); }
function setTheme(fromIdx, toIdx, themeIdx) {
  for (let i=fromIdx; i<toIdx && i<segments.length; i++) segments[i].theme = THEMES[themeIdx % THEMES.length];
}
function segmentAt(z) { return segments[Math.floor(z / CFG.SEG_LEN) % segments.length]; }

function buildTrack() {
  segments = [];
  const stageLen = 600;
  for (let s = 0; s < CFG.STAGES; s++) {
    const startIdx = segments.length;
    addStraight(30);
    addRoad(20,20,20,-2,0); addRoad(20,20,20,3,20);
    addStraight(20);
    addHill(30, (s%2?30:-30));
    addCurve(30, s%2?3:-3);
    addRoad(10,10,10,0,5); addRoad(10,10,10,0,-5);
    addStraight(20);
    addCurve(40, s%2?-4:4, 20);
    addStraight(30);
    const endIdx = segments.length;
    segments[endIdx - 1].isFork = true;
    setTheme(startIdx, endIdx, s);
    for (let i = startIdx + 3; i < endIdx; i += 55) segments[i].isCheckpoint = true;
  }
  // 景物
  for (let i=10; i<segments.length; i+=4+Math.floor(Math.random()*6)) {
    const offset = (Math.random()*2-1) * 1.2;
    segments[i].sprites.push({ offset, type: segments[i].theme.sprites });
  }
  trackLength = segments.length * CFG.SEG_LEN;
}

// ==================== 投影 ====================
function project(p, camX, camY, camZ) {
  p.camera.x = p.world.x - camX;
  p.camera.y = p.world.y - camY;
  p.camera.z = p.world.z - camZ;
  p.screen.scale = camDepth / Math.max(p.camera.z, 1);
  p.screen.x = Math.floor(W/2 + (p.screen.scale * p.camera.x * W / 2));
  p.screen.y = Math.floor(H/2 - (p.screen.scale * p.camera.y * H / 2));
  p.screen.w = Math.floor(p.screen.scale * CFG.ROAD_W * W / 2);
}

// ==================== 颜色工具 ====================
function shade(hex, pct) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const f = pct/100;
  return `rgb(${Math.max(0,Math.min(255,Math.floor(r + 255*f)))},${Math.max(0,Math.min(255,Math.floor(g + 255*f)))},${Math.max(0,Math.min(255,Math.floor(b + 255*f)))})`;
}
function fogColor(hex, fog) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const f = 1 - fog;
  return `rgb(${Math.floor(r*f+180*fog)},${Math.floor(g*f+180*fog)},${Math.floor(b*f+180*fog)})`;
}

// ==================== Phaser 游戏类 ====================
let W = 0, H = 0;
window.game = null;  // 暴露到 window 方便调试

class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  create() {
    // HEADLESS 模式, Phaser 不创建 canvas, 我们自己初始化 DOM 里的 #game
    const canvas = document.getElementById('game');
    const vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // DPR 缩放
    const ctx = canvas.getContext('2d');
    if (ctx) ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // 监听 resize
    this.scale.on('resize', () => {
      W = vv ? vv.width : window.innerWidth;
      H = vv ? vv.height : window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      const c = canvas.getContext('2d');
      if (c) c.setTransform(DPR, 0, 0, DPR, 0, 0);
    });

    this.scene.start('Game');
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    // 状态
    this.gameState = 'title'; // title | playing | fork | over
    this.player = { x:0, z:0, speed:0, hitFlash:0, invuln:0, lastCP:-1 };
    this.timeLeft = CFG.START_TIME;
    this.score = 0;
    this.stage = 1;
    this.currentTheme = THEMES[0];
    this.branchHistory = [];
    this.dist = 0;
    this.aiCars = [];
    this.lastTime = this.time.now;

    // 输入
    this.cursors = this.input.keyboard.createCursorKeys();
    this.inputA = { left:false, right:false, gas:false, brake:false };
    this.input.keyboard.on('keydown', e => {
      switch(e.code) {
        case 'ArrowLeft': this.inputA.left = true; break;
        case 'ArrowRight': this.inputA.right = true; break;
        case 'ArrowUp': this.inputA.gas = true; break;
        case 'ArrowDown': this.inputA.brake = true; break;
        case 'Space': this.audioSfx('horn'); break;
      }
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    });
    this.input.keyboard.on('keyup', e => {
      switch(e.code) {
        case 'ArrowLeft': this.inputA.left = false; break;
        case 'ArrowRight': this.inputA.right = false; break;
        case 'ArrowUp': this.inputA.gas = false; break;
        case 'ArrowDown': this.inputA.brake = false; break;
      }
    });

    // 触控按钮绑定到 DOM (Phaser 之外的 overlay)
    this.bindTouchButtons();

    // DOM 按钮事件
    document.getElementById('btnStart').addEventListener('click', () => this.startGame());
    document.getElementById('btnRetry').addEventListener('click', () => this.startGame());
    document.getElementById('btnForkLeft').addEventListener('click', () => this.chooseBranch(0));
    document.getElementById('btnForkRight').addEventListener('click', () => this.chooseBranch(1));
    document.getElementById('musicBtn').addEventListener('click', () => this.toggleMusic());

    // 监听 Phaser resize 事件
    this.scale.on('resize', (gameSize) => {
      W = gameSize.width; H = gameSize.height;
    });
  }

  bindTouchButtons() {
    const bind = (id, key) => {
      const el = document.getElementById(id);
      const on = (e) => { e.preventDefault(); this.inputA[key]=true; el.classList.add('active'); };
      const off = (e) => { e.preventDefault(); this.inputA[key]=false; el.classList.remove('active'); };
      // pointer 事件统一支持触摸+鼠标
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('pointerleave', off);
      // 全局 pointerup 兜底: 手指滑出按钮后松开也能复位
      document.addEventListener('pointerup', () => { this.inputA[key]=false; el.classList.remove('active'); });
    };
    bind('btnLeft','left'); bind('btnRight','right');
    bind('btnGas','gas'); bind('btnBrake','brake');
  }

  startGame() {
    this.player = { x:0, z:0, speed:0, hitFlash:0, invuln:0, lastCP:-1 };
    this.timeLeft = CFG.START_TIME; this.score = 0; this.stage = 1; this.dist = 0;
    this.branchHistory = [];
    this.currentTheme = THEMES[0];
    buildTrack();
    this.spawnAICars();
    this.gameState = 'playing';

    document.getElementById('overlayTitle').classList.add('hidden');
    document.getElementById('overlayOver').classList.add('hidden');
    document.getElementById('overlayFork').classList.add('hidden');

    this.initAudio();
    this.startMusic();
  }

  spawnAICars() {
    this.aiCars = [];
    const usedSegs = new Set();
    const tryPick = (min, max, gap) => {
      for (let a=0; a<50; a++) {
        const segIdx = min + Math.floor(Math.random() * (max - min));
        let ok = true;
        for (let d=-gap; d<=gap; d++) if (usedSegs.has(segIdx+d)) { ok=false; break; }
        if (ok) return segIdx;
      }
      return -1;
    };
    // 近距 12 辆 (间隔 3 段)
    for (let i=0;i<12;i++) {
      const s = tryPick(15, 50, 3); if (s<0) break;
      usedSegs.add(s);
      this.aiCars.push({ offset:(Math.random()*2-1)*0.6, speed:800+Math.random()*3500, z:s*CFG.SEG_LEN, color:CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)] });
    }
    // 中距 15 辆 (间隔 4 段)
    for (let i=0;i<15;i++) {
      const s = tryPick(50, 120, 4); if (s<0) break;
      usedSegs.add(s);
      this.aiCars.push({ offset:(Math.random()*2-1)*0.6, speed:1500+Math.random()*3500, z:s*CFG.SEG_LEN, color:CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)] });
    }
    // 远距 8 辆 (间隔 6 段)
    for (let i=0;i<8;i++) {
      const s = tryPick(120, Math.min(200, CFG.DRAW_DIST-5), 6); if (s<0) break;
      usedSegs.add(s);
      this.aiCars.push({ offset:(Math.random()*2-1)*0.6, speed:2000+Math.random()*3500, z:s*CFG.SEG_LEN, color:CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)] });
    }
  }

  chooseBranch(branch) {
    this.player.x = branch === 0 ? -0.5 : 0.5;
    this.gameState = 'playing';
    document.getElementById('overlayFork').classList.add('hidden');
  }

  endGame(win) {
    this.gameState = 'over';
    this.stopMusic();
    document.getElementById('overTitle').textContent = win ? '终点抵达！' : '时间耗尽！';
    document.getElementById('overTitle').style.color = win ? '#44dd66' : '#ff4040';
    document.getElementById('overScore').textContent = this.score.toLocaleString();
    document.getElementById('overDist').textContent = Math.floor(this.dist);
    const rank = this.dist > trackLength*0.8 ? 'S' : this.dist > trackLength*0.5 ? 'A' : this.dist > trackLength*0.2 ? 'B' : 'C';
    document.getElementById('rank').textContent = rank;
    document.getElementById('overlayOver').classList.remove('hidden');
  }

  /* ==========================================================
   * 主循环 — update() 更新逻辑, render() 用 Phaser Graphics + 手写 Canvas 2D 画道路
   * Phaser 的 Graphics API 本质就是 Canvas 2D polygon, 够用
   * ========================================================== */
  update(_, deltaMs) {
    // HEADLESS 模式下 render() 不会被自动调用, 必须手动调
    this.render();

    const dt = deltaMs / 1000;

    // 更新 DOM HUD
    document.getElementById('hudTime').textContent = `TIME ${this.timeLeft.toFixed(1)}`;
    document.getElementById('hudTime').classList.toggle('warn', this.timeLeft < 10);
    document.getElementById('hudStage').textContent = `STAGE ${this.stage}/${CFG.STAGES}`;
    document.getElementById('hudScore').textContent = `SCORE ${this.score}`;

    if (this.gameState !== 'playing') return;

    const p = this.player;

    // --- 物理: 加速/刹车 ---
    if (this.inputA.gas) p.speed += CFG.ACCEL * dt;
    else if (this.inputA.brake) p.speed += CFG.BRAKE * dt;
    else p.speed += CFG.DECEL * dt;
    p.speed = Math.max(0, Math.min(CFG.MAX_SPEED, p.speed));

    // --- 转向 + 弯道离心力 ---
    const seg = segmentAt(p.z);
    const dx = (this.inputA.right ? 1 : 0) - (this.inputA.left ? 1 : 0);
    p.x += dx * CFG.STEER * dt * 2 * (p.speed / CFG.MAX_SPEED);
    p.x -= seg.curve * CFG.CENTRIFUGAL * (p.speed / CFG.MAX_SPEED) * dt;

    // --- 夹紧: 车不能无限偏移飞出屏幕 ---
    p.x = Math.max(-CFG.ROAD_LIMIT, Math.min(CFG.ROAD_LIMIT, p.x));

    // --- 路外减速 + 微弱回拉 (避免被甩出去后卡死) ---
    if (Math.abs(p.x) > 1.0) {
      p.speed += CFG.OFFROAD_DECEL * dt;
      p.speed = Math.max(0, p.speed);
      if (p.speed > CFG.OFFROAD_LIMIT) p.speed = CFG.OFFROAD_LIMIT;
      // 路外时给一个微弱回拉力, 把车慢慢拉回路面
      const pullBack = (p.x > 0 ? -1 : 1) * 0.8 * dt;
      p.x += pullBack;
    } else {
      p.speed = Math.min(p.speed, CFG.MAX_SPEED);
    }

    // --- 前进 ---
    p.z += p.speed * dt;
    this.dist = Math.max(this.dist, p.z);
    if (p.z >= trackLength) { this.endGame(true); return; }

    // --- 检查点 ---
    const cpIdx = Math.floor(p.z / CFG.SEG_LEN);
    if (segments[cpIdx] && segments[cpIdx].isCheckpoint && p.lastCP < cpIdx) {
      p.lastCP = cpIdx; this.timeLeft += CFG.CP_TIME;
      this.audioSfx('checkpoint');
    }

    // --- 关卡切换 ---
    const stageSegLen = trackLength / CFG.STAGES;
    const newStage = Math.min(CFG.STAGES, Math.floor(p.z / stageSegLen) + 1);
    if (newStage !== this.stage) {
      this.stage = newStage;
      const branch = p.x < 0 ? 0 : 1;
      this.branchHistory.push(branch);
      const themeIdx = (this.stage - 1 + branch) % THEMES.length;
      this.currentTheme = THEMES[themeIdx];
    }

    // --- 倒计时 ---
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) { this.timeLeft = 0; this.endGame(false); return; }

    // --- AI 车更新 ---
    for (const car of this.aiCars) {
      car.z += car.speed * dt;
      if (car.z > p.z + CFG.DRAW_DIST * CFG.SEG_LEN) {
        car.z = p.z - CFG.DRAW_DIST * CFG.SEG_LEN * 0.3;
        car.offset = (Math.random()*2-1)*0.6;
      }
      if (car.z < p.z - CFG.SEG_LEN * 20) {
        car.z = p.z + CFG.DRAW_DIST * CFG.SEG_LEN * 0.8;
        car.offset = (Math.random()*2-1)*0.6;
      }
    }

    // --- 碰撞 ---
    if (p.invuln > 0) p.invuln -= dt;
    else {
      for (const car of this.aiCars) {
        const dz = Math.abs(car.z - p.z);
        if (dz < CFG.SEG_LEN * 0.9 && Math.abs(car.offset - p.x) < 0.55) {
          p.speed *= CFG.HIT_SLOW;
          p.invuln = 0.8; p.hitFlash = 0.4;
          this.timeLeft = Math.max(0, this.timeLeft - CFG.HIT_TIME_LOSS);
          this.audioSfx('crash');
          break;
        }
      }
    }
    if (p.hitFlash > 0) p.hitFlash -= dt;

    // --- 分叉点 ---
    if (segments[cpIdx] && segments[cpIdx].isFork && p.invuln < 0.5) {
      if (document.getElementById('overlayFork').classList.contains('hidden') === false) {
        // 正在等待选择
      } else {
        // 显示分叉选择
        this.gameState = 'fork';
        document.getElementById('overlayFork').classList.remove('hidden');
      }
    }

    // --- 得分 ---
    this.score += Math.floor(p.speed * dt * 0.05);
  }

  /* ==========================================================
   * render() — 用 Phaser Graphics + Canvas 2D 画伪3D道路
   * 核心优化: 路面主体先画一个完整梯形底色, 分段只画 rumble / 车道线
   *           → 彻底消除分段路面的横向条纹
   * ========================================================== */
  render() {
    // HEADLESS 模式, 完全用 DOM #game canvas 的 2D context 画
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    // 清屏 (DPR transform 已由 BootScene 设好, 直接用 W/H 逻辑坐标)
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const theme = this.currentTheme;

    // === 1. 天空 + 远山 + 草地 ===
    this.drawSky2D(ctx, theme);

    if (this.gameState === 'title') {
      this.drawTitleRoad2D(ctx, theme);
      return;
    }

    const pSeg = segmentAt(this.player.z);
    const camX = this.player.x * CFG.ROAD_W;
    const camY = CFG.CAM_H + pSeg.p1.world.y;
    const camZ = this.player.z;

    let x = 0, dx = 0;
    let maxy = H;

    // 投影所有可见段
    const visibleSegs = [];
    for (let n = 0; n < CFG.DRAW_DIST; n++) {
      const segIdx = (pSeg.index + n) % segments.length;
      const seg = segments[segIdx];
      seg.fog = Math.pow(n / CFG.DRAW_DIST, CFG.FOG);

      seg.p1.world.x = x;
      seg.p2.world.x = x + dx;
      x += dx; dx += seg.curve;

      project(seg.p1, camX - seg.p1.world.x, camY, camZ);
      project(seg.p2, camX - seg.p2.world.x, camY, camZ);

      if (seg.p1.camera.z <= camDepth || seg.p2.screen.y >= seg.p1.screen.y) continue;
      visibleSegs.push({ seg, n });
    }

    // === 2. 路面主体 — 用所有可见段的左右边缘拼成一个弯曲多边形 ===
    //    这样路面跟着弯道弯曲, 而且是一次填充无分段缝隙
    if (visibleSegs.length > 0) {
      ctx.fillStyle = theme.road;
      ctx.beginPath();
      // 左边缘: 远→近 (从上到下)
      const first = visibleSegs[0].seg;
      const last = visibleSegs[visibleSegs.length - 1].seg;
      ctx.moveTo(first.p1.screen.x - first.p1.screen.w, first.p1.screen.y);
      for (const vs of visibleSegs) {
        ctx.lineTo(vs.seg.p1.screen.x - vs.seg.p1.screen.w, vs.seg.p1.screen.y);
      }
      ctx.lineTo(last.p2.screen.x - last.p2.screen.w, last.p2.screen.y);
      // 右边缘: 近→远 (从下到上)
      ctx.lineTo(last.p2.screen.x + last.p2.screen.w, last.p2.screen.y);
      for (let i = visibleSegs.length - 1; i >= 0; i--) {
        const seg = visibleSegs[i].seg;
        ctx.lineTo(seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y);
      }
      ctx.lineTo(first.p1.screen.x + first.p1.screen.w, first.p1.screen.y);
      ctx.closePath();
      ctx.fill();

      // 路面边缘白线 (沿着弯曲的路面边缘画)
      ctx.strokeStyle = '#f5f5f5';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(first.p1.screen.x - first.p1.screen.w, first.p1.screen.y);
      for (const vs of visibleSegs) ctx.lineTo(vs.seg.p1.screen.x - vs.seg.p1.screen.w, vs.seg.p1.screen.y);
      ctx.lineTo(last.p2.screen.x - last.p2.screen.w, last.p2.screen.y);
      ctx.moveTo(first.p1.screen.x + first.p1.screen.w, first.p1.screen.y);
      for (const vs of visibleSegs) ctx.lineTo(vs.seg.p1.screen.x + vs.seg.p1.screen.w, vs.seg.p1.screen.y);
      ctx.lineTo(last.p2.screen.x + last.p2.screen.w, last.p2.screen.y);
      ctx.stroke();

      // 车道中心黄线 (沿路面中心线画虚线)
      for (const vs of visibleSegs) {
        const seg = vs.seg;
        if (seg.index % 6 < 3) {
          ctx.strokeStyle = '#ffd23f';
          ctx.lineWidth = Math.max(1, seg.p1.screen.w * 0.015);
          ctx.globalAlpha = Math.max(0.3, 1 - seg.fog * 0.7);
          ctx.beginPath();
          ctx.moveTo(seg.p1.screen.x, seg.p1.screen.y);
          ctx.lineTo(seg.p2.screen.x, seg.p2.screen.y);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }

    // === 3. rumble strip (红白路缘) — 每段都画, 紧贴路面边缘, 跟着弯道弯曲 ===
    for (let i = 0; i < visibleSegs.length; i++) {
      const { seg } = visibleSegs[i];
      if (seg.p2.screen.y >= maxy) continue;

      const r = seg.p2.screen.w * 0.12;
      const rumbleA = Math.floor(seg.index / 8) % 2 === 0;
      const col = rumbleA ? theme.rumble[0] : theme.rumble[1];
      const fogCol = fogColor(col, seg.fog);

      const p1 = seg.p1.screen, p2 = seg.p2.screen;
      ctx.fillStyle = fogCol;
      // 左侧路缘 (紧贴路面左边缘)
      ctx.beginPath();
      ctx.moveTo(p1.x - p1.w, p1.y);
      ctx.lineTo(p1.x - p1.w - r, p1.y);
      ctx.lineTo(p2.x - p2.w - r, p2.y);
      ctx.lineTo(p2.x - p2.w, p2.y);
      ctx.closePath(); ctx.fill();
      // 右侧路缘 (紧贴路面右边缘)
      ctx.beginPath();
      ctx.moveTo(p1.x + p1.w, p1.y);
      ctx.lineTo(p1.x + p1.w + r, p1.y);
      ctx.lineTo(p2.x + p2.w + r, p2.y);
      ctx.lineTo(p2.x + p2.w, p2.y);
      ctx.closePath(); ctx.fill();

      maxy = seg.p2.screen.y;
    }

    // === 4. 景物 + AI 车 (远→近, 逆序遍历) ===
    for (let i = visibleSegs.length - 1; i >= 0; i--) {
      const { seg, n } = visibleSegs[i];
      this.drawSprites2D(ctx, seg);
      this.drawAICars2D(ctx, seg);
    }

    // === 5. 连续远雾覆盖 ===
    {
      const horizonY = H * 0.5;
      const grad = ctx.createLinearGradient(0, horizonY - 20, 0, horizonY + 200);
      grad.addColorStop(0, 'rgba(180,180,180,0.5)');
      grad.addColorStop(0.5, 'rgba(180,180,180,0.12)');
      grad.addColorStop(1, 'rgba(180,180,180,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, horizonY - 20, W, 220);
    }

    // === 6. 玩家车 ===
    this.drawPlayerCar2D(ctx);
  }

  // ========== Canvas 2D 版本的绘制函数 ==========

  drawSky2D(ctx, theme) {
    const horizonY = H * 0.5;
    // 天空渐变
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0, theme.sky[0]);
    skyGrad.addColorStop(1, theme.sky[1]);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, horizonY);

    // 云朵 / 星空
    if (theme.name === 'night') {
      ctx.fillStyle = '#fff';
      for (let i=0;i<80;i++){
        const x=(i*137.5)%W, y=(i*53.7)%(horizonY*0.5);
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.fillStyle = '#ffee88';
      ctx.beginPath(); ctx.arc(W*0.8, horizonY*0.3, 28, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      this.drawCloud2D(ctx, W*0.2, horizonY*0.3, 60);
      this.drawCloud2D(ctx, W*0.6, horizonY*0.2, 80);
      this.drawCloud2D(ctx, W*0.85, horizonY*0.44, 50);
    }

    // 远山轮廓
    ctx.fillStyle = shade(theme.grass[0], -25);
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    for (let x=0; x<=W; x+=40) {
      ctx.lineTo(x, horizonY - Math.sin(x*0.01 + 1)*25 - 15);
    }
    ctx.lineTo(W, horizonY); ctx.closePath(); ctx.fill();

    // 草地渐变 (一次画完)
    const grassGrad = ctx.createLinearGradient(0, horizonY, 0, H);
    grassGrad.addColorStop(0, shade(theme.grass[0], -10));
    grassGrad.addColorStop(1, theme.grass[0]);
    ctx.fillStyle = grassGrad;
    ctx.fillRect(0, horizonY, W, H - horizonY);
  }

  drawCloud2D(ctx, x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.arc(x+r*0.8, y+10, r*0.8, 0, Math.PI*2);
    ctx.arc(x-r*0.8, y+10, r*0.7, 0, Math.PI*2);
    ctx.fill();
  }

  drawTitleRoad2D(ctx, theme) {
    const horizonY = H * 0.5;
    const nearY = H;
    const farW = 30;
    const nearW = W * 0.45;
    // 路面
    ctx.fillStyle = theme.road;
    ctx.beginPath();
    ctx.moveTo(W/2 - farW, horizonY);
    ctx.lineTo(W/2 - nearW, nearY);
    ctx.lineTo(W/2 + nearW, nearY);
    ctx.lineTo(W/2 + farW, horizonY);
    ctx.closePath(); ctx.fill();
    // rumble
    ctx.fillStyle = theme.rumble[0];
    ctx.beginPath();
    ctx.moveTo(W/2 - farW - 5, horizonY);
    ctx.lineTo(W/2 - farW, horizonY);
    ctx.lineTo(W/2 - nearW, nearY);
    ctx.lineTo(W/2 - nearW - 30, nearY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = theme.rumble[1];
    ctx.beginPath();
    ctx.moveTo(W/2 + farW, horizonY);
    ctx.lineTo(W/2 + farW + 5, horizonY);
    ctx.lineTo(W/2 + nearW + 30, nearY);
    ctx.lineTo(W/2 + nearW, nearY);
    ctx.closePath(); ctx.fill();
    // 中心黄线
    ctx.strokeStyle = '#ffd23f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W/2, horizonY); ctx.lineTo(W/2, nearY);
    ctx.stroke();
  }

  drawSprites2D(ctx, seg) {
    for (const sp of seg.sprites) {
      const scale = seg.p1.screen.scale;
      const destX = seg.p1.screen.x + scale * sp.offset * CFG.ROAD_W * W/2;
      const destY = seg.p1.screen.y;
      const destW = scale * CFG.ROAD_W * W/2 * 0.3;
      const destH = destW * 2.5;
      this.drawSprite2D(ctx, sp.type, destX, destY, destW, destH, seg.fog);
    }
  }

  drawSprite2D(ctx, type, x, y, w, h, fog) {
    ctx.globalAlpha = Math.max(0.2, 1 - fog * 0.7);
    if (type === 'palm') {
      ctx.fillStyle = '#7a5230';
      ctx.fillRect(x - w*0.06, y - h*0.85, w*0.12, h*0.85);
      ctx.fillStyle = '#2ea84a';
      ctx.beginPath(); ctx.arc(x, y - h*0.9, w*0.45, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1e8038';
      ctx.beginPath(); ctx.arc(x - w*0.25, y - h*0.82, w*0.28, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + w*0.25, y - h*0.82, w*0.28, 0, Math.PI*2); ctx.fill();
    } else if (type === 'cactus') {
      ctx.fillStyle = '#2d8a3a';
      ctx.fillRect(x - w*0.1, y - h*0.85, w*0.2, h*0.85);
      ctx.fillRect(x - w*0.35, y - h*0.55, w*0.15, h*0.35);
      ctx.fillRect(x + w*0.2, y - h*0.65, w*0.15, h*0.45);
    } else if (type === 'pine') {
      ctx.fillStyle = '#1a3a20';
      ctx.fillRect(x - w*0.04, y - h*0.85, w*0.08, h*0.85);
      ctx.fillStyle = '#2d5a30';
      for (let k=0;k<3;k++) {
        const yy = y - h*(0.55 + k*0.15);
        ctx.beginPath();
        ctx.moveTo(x, yy - h*0.18);
        ctx.lineTo(x - w*(0.3 + k*0.08), yy + h*0.08);
        ctx.lineTo(x + w*(0.3 + k*0.08), yy + h*0.08);
        ctx.closePath(); ctx.fill();
      }
    } else if (type === 'rock') {
      ctx.fillStyle = '#808090';
      ctx.beginPath(); ctx.arc(x, y - h*0.15, w*0.4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#606070';
      ctx.beginPath(); ctx.arc(x - w*0.15, y - h*0.1, w*0.25, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  drawAICars2D(ctx, seg) {
    for (const car of this.aiCars) {
      const cs = Math.floor(car.z / CFG.SEG_LEN) % segments.length;
      if (cs !== seg.index) continue;
      const scale = seg.p1.screen.scale;
      const cx = seg.p1.screen.x + scale * car.offset * CFG.ROAD_W * W/2;
      const cy = seg.p1.screen.y;
      const cw = scale * CFG.ROAD_W * W/2 * 0.42;
      const ch = cw * 0.65;
      this.drawCar2D(ctx, cx, cy, cw, ch, car.color, false, seg.fog);
    }
  }

  drawCar2D(ctx, x, y, w, h, color, isPlayer, fog=0) {
    ctx.globalAlpha = Math.max(0.3, 1 - fog * 0.5);
    const dark = shade(color, -55);
    const lite = shade(color, 50);

    // 地面阴影
    ctx.fillStyle = 'rgba(0,0,0,' + (0.35 * ctx.globalAlpha) + ')';
    ctx.beginPath(); ctx.ellipse(x, y + 2, w*0.5, h*0.12, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = Math.max(0.3, 1 - fog * 0.5);

    // 车轮
    ctx.fillStyle = '#111';
    const wheelW = w * 0.18, wheelH = h * 0.32;
    ctx.fillRect(x - w*0.5 - wheelW*0.1, y - wheelH*0.5, wheelW, wheelH);
    ctx.fillRect(x + w*0.5 - wheelW*0.9, y - wheelH*0.5, wheelW, wheelH);

    // 车身 (梯形: 两个三角形拼)
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x - w*0.46, y - h*0.32);
    ctx.lineTo(x + w*0.46, y - h*0.32);
    ctx.lineTo(x + w*0.42, y - h*0.78);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - w*0.46, y - h*0.32);
    ctx.lineTo(x + w*0.42, y - h*0.78);
    ctx.lineTo(x - w*0.42, y - h*0.78);
    ctx.closePath(); ctx.fill();

    // 车顶
    ctx.beginPath();
    ctx.moveTo(x - w*0.40, y - h*0.78);
    ctx.lineTo(x + w*0.40, y - h*0.78);
    ctx.lineTo(x + w*0.36, y - h*0.96);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - w*0.40, y - h*0.78);
    ctx.lineTo(x + w*0.36, y - h*0.96);
    ctx.lineTo(x - w*0.36, y - h*0.96);
    ctx.closePath(); ctx.fill();

    // 挡风
    ctx.fillStyle = isPlayer ? '#0d1117' : '#14181f';
    ctx.beginPath();
    ctx.moveTo(x - w*0.38, y - h*0.70);
    ctx.lineTo(x + w*0.38, y - h*0.70);
    ctx.lineTo(x + w*0.30, y - h*0.42);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - w*0.38, y - h*0.70);
    ctx.lineTo(x + w*0.30, y - h*0.42);
    ctx.lineTo(x - w*0.30, y - h*0.42);
    ctx.closePath(); ctx.fill();

    // 尾灯
    ctx.fillStyle = '#ff1a1a';
    ctx.fillRect(x - w*0.44, y - h*0.55, w*0.16, h*0.16);
    ctx.fillRect(x + w*0.28, y - h*0.55, w*0.16, h*0.16);

    // 侧面阴影
    ctx.fillStyle = dark;
    ctx.fillRect(x - w*0.46, y - h*0.78, w*0.06, h*0.46);
    ctx.fillRect(x + w*0.40, y - h*0.78, w*0.06, h*0.46);

    ctx.globalAlpha = 1;
  }

  drawPlayerCar2D(ctx) {
    const bw = Math.min(W, H) * 0.26;
    const bh = bw * 0.78;
    const cx = W/2;
    const cy = H - bh * 0.25;
    const tilt = (this.inputA.left ? -0.05 : 0) + (this.inputA.right ? 0.05 : 0);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);
    if (this.player.hitFlash > 0 && Math.floor(this.player.hitFlash*20) % 2) ctx.globalAlpha = 0.4;

    const color = '#e63946';
    const dark = shade(color, -55);
    const lite = shade(color, 50);

    // 地面阴影
    ctx.fillStyle = 'rgba(0,0,0,' + (0.4 * ctx.globalAlpha) + ')';
    ctx.beginPath(); ctx.ellipse(0, 2, bw*0.52, bh*0.13, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = this.player.hitFlash > 0 ? 0.4 : 1;

    // 车轮
    ctx.fillStyle = '#111';
    const wheelW = bw*0.16, wheelH = bh*0.35;
    ctx.fillRect(-bw*0.5-wheelW*0.1, -wheelH*0.2, wheelW, wheelH);
    ctx.fillRect(bw*0.5-wheelW*0.9, -wheelH*0.2, wheelW, wheelH);

    // 车身主体
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-bw*0.46, -bh*0.32);
    ctx.lineTo(bw*0.46, -bh*0.32);
    ctx.lineTo(bw*0.42, -bh*0.78);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-bw*0.46, -bh*0.32);
    ctx.lineTo(bw*0.42, -bh*0.78);
    ctx.lineTo(-bw*0.42, -bh*0.78);
    ctx.closePath(); ctx.fill();

    // 保险杠
    ctx.fillStyle = '#1a1a1f';
    ctx.fillRect(-bw*0.46, -bh*0.32, bw*0.92, bh*0.08);

    // 后挡风
    ctx.fillStyle = '#0d1117';
    ctx.beginPath();
    ctx.moveTo(-bw*0.38, -bh*0.70);
    ctx.lineTo(bw*0.38, -bh*0.70);
    ctx.lineTo(bw*0.30, -bh*0.42);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-bw*0.38, -bh*0.70);
    ctx.lineTo(bw*0.30, -bh*0.42);
    ctx.lineTo(-bw*0.30, -bh*0.42);
    ctx.closePath(); ctx.fill();

    // 尾灯
    ctx.fillStyle = '#ff1a1a';
    ctx.fillRect(-bw*0.44, -bh*0.55, bw*0.16, bh*0.16);
    ctx.fillRect(bw*0.28, -bh*0.55, bw*0.16, bh*0.16);

    // 敞篷座舱
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.moveTo(-bw*0.35, -bh*0.80);
    ctx.lineTo(bw*0.35, -bh*0.80);
    ctx.lineTo(bw*0.30, -bh*0.96);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-bw*0.35, -bh*0.80);
    ctx.lineTo(bw*0.30, -bh*0.96);
    ctx.lineTo(-bw*0.30, -bh*0.96);
    ctx.closePath(); ctx.fill();

    // 侧面阴影
    ctx.fillStyle = dark;
    ctx.fillRect(-bw*0.46, -bh*0.78, bw*0.06, bh*0.46);
    ctx.fillRect(bw*0.40, -bh*0.78, bw*0.06, bh*0.46);

    ctx.restore();
  }

  /* ==========================================================
   * 音频 — Web Audio FM 合成器 BGM, 可开关
   * ========================================================== */
  initAudio() {
    if (this.audioInited) return;
    this.audioInited = true;
    try {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { this.audioCtx = null; }
    this.musicOn = true;
    this.musicPlaying = false;
    this.musicStep = 0;
    this.musicTimer = null;
  }
  startMusic() {
    if (!this.audioCtx || !this.musicOn) return;
    if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
    this.musicPlaying = true;
    const bpm = 128, beat = 60/bpm/2;
    this._beat = beat;
    const tick = () => {
      if (!this.musicPlaying) return;
      const i = this.musicStep % 8;
      this.fmNote([330,392,440,523,587,659,784,880][i], this._beat*1.8, 'triangle', 0.18);
      this.fmNote([659,784,880,988,1175,1319,1568,1760][i], this._beat*1.6, 'square', 0.08);
      if (i === 0 || i === 4) this.drum(60, 0.05, 0.2);
      if (i === 2 || i === 6) this.drum(80, 0.03, 0.12);
      this.musicStep++;
      this.musicTimer = setTimeout(tick, this._beat * 1000);
    };
    tick();
  }
  stopMusic() { this.musicPlaying = false; if (this.musicTimer) clearTimeout(this.musicTimer); }
  toggleMusic() {
    this.musicOn = !this.musicOn;
    document.getElementById('musicBtn').style.opacity = this.musicOn ? '1' : '0.4';
    if (this.musicOn) this.startMusic(); else this.stopMusic();
  }
  fmNote(freq, dur, type='square', vol=0.1) {
    if (!this.audioCtx) return;
    const ctx = this.audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.start(now); osc.stop(now + dur);
  }
  drum(freq, dur, vol) { this.fmNote(freq, dur, 'square', vol); }
  audioSfx(type) {
    if (!this.audioCtx) return;
    if (type === 'crash') { this.fmNote(120, 0.3, 'sawtooth', 0.2); }
    else if (type === 'horn') { this.fmNote(440, 0.4, 'square', 0.2); }
    else if (type === 'checkpoint') {
      this.fmNote(660, 0.1, 'square', 0.15);
      setTimeout(() => this.fmNote(880, 0.1, 'square', 0.15), 100);
    }
  }
}

// ==================== Phaser 启动 ====================
// 注意: 我们用 Phaser 的 Graphics + 直接操作 Canvas, render 用 Phaser 的 WebGL 模式
// 但 GameScene.render() 会拿 canvas.getContext('2d') 画覆盖层
// 所以 type 用 CANVAS 模式更方便, 直接拿 2D context
function createGame() {
  const config = {
    type: Phaser.HEADLESS,  // 不创建任何 canvas, 只用 Phaser 做逻辑
    audio: { noAudio: true },  // 我们自己用 Web Audio
    scene: [BootScene, GameScene],
    fps: { target: 60 },
  };
  window.game = new Phaser.Game(config);
}

createGame();

</script>
