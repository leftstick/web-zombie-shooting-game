<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="landscape" />
    <title>BIOHAZARD · 生化危机 · 横版枪战</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: 'Courier New', monospace;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* 竖屏时显示旋转提示 */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 24px;
        padding: 24px;
      }
      #rotate-hint .icon {
        font-size: 72px;
        animation: rotateHint 2s ease-in-out infinite;
      }
      #rotate-hint .title {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 2px;
      }
      #rotate-hint .sub {
        font-size: 14px;
        opacity: 0.7;
      }
      @keyframes rotateHint {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) {
        #rotate-hint {
          display: flex;
        }
        #game-root {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="rotate-hint">
      <div class="icon">📱</div>
      <div class="title">请旋转设备至横屏</div>
      <div class="sub">本游戏必须在横屏模式下游玩</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
